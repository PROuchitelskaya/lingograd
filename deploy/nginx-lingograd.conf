# Лингоград — игра по русскому языку.
# Проксирование на локальный процесс плюс WebSocket: у игры постоянные
# соединения с телефонами учеников на весь урок.
server {
    listen 80;
    listen [::]:80;
    server_name lingograd.prouchitelskaya.ru lingograd.arinagalitskaia.ru;

    # Логи выключены намеренно: в access.log попадали бы IP-адреса телефонов.
    # Игра не собирает персональных данных — журнал не должен их заводить.
    access_log off;
    error_log /var/log/nginx/lingograd-error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4190;
        proxy_http_version 1.1;

        # апгрейд до WebSocket — без него не будет ни таймера, ни синхронных заданий
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # урок идёт 45 минут: соединение не должно рваться по таймауту
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
